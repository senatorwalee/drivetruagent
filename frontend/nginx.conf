# Same shape as `make ui`: the browser talks to one origin, and /api goes to
# the backend with the prefix taken off.
server {
    listen 80;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # A turn with several model calls can take a few seconds.
        proxy_read_timeout 120s;
        # Menu photos are uploaded through here. The API refuses more than
        # 5 MB itself; nginx's own limit is 1 MB unless raised.
        client_max_body_size 6m;
    }

    location / {
        root /usr/share/nginx/html;
        # The app does its own routing (/staff): unknown paths get index.html.
        try_files $uri /index.html;
    }
}

# What the internet may reach. `make tunnel` makes this port public: the
# phone line's webhook, so OpenAI can ring it, and the web phone (the /call
# page and its own endpoints, which need WEB_PHONE_KEY). Nothing else is
# served here, so the rest of the API (which has no logins yet) stays on
# this machine.
server {
    listen 8081;

    location = /phone/incoming {
        limit_except POST { deny all; }
        proxy_pass http://api:8000/phone/incoming;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 64k;
    }

    # The web phone page: the app, which shows the page for /call.
    location = /call {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location /assets/ {
        root /usr/share/nginx/html;
    }

    location = /favicon.svg {
        root /usr/share/nginx/html;
    }

    location /api/web-phone/ {
        proxy_pass http://api:8000/web-phone/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 64k;
    }

    location / {
        return 404;
    }
}
