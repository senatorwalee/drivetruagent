name: CI

# Runs on every pushed commit, on every branch. Pull requests show these
# results because checks attach to the commit.
on:
  push:
  workflow_dispatch:

# A newer push to the same branch cancels the run for the older commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Backend lint, type check and test
    runs-on: ubuntu-latest
    # The tests take about 5 minutes; a slow runner once took twice that.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml.
      # uv installs the Python version named in .python-version.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      # The integration tests start their own Postgres container; GitHub's
      # runners have Docker available.
      - name: Test
        run: uv run pytest

  frontend:
    name: Frontend lint, type check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` installs exactly what package-lock.json records.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
