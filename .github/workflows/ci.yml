name: CI

# Runs on every pushed commit, on every branch. Pull requests show these
# results because checks attach to the commit.
on:
  push:
  workflow_dispatch:

# A newer push to the same branch cancels the run for the older commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, type check and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml.
      # uv installs the Python version named in .python-version.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      # The integration tests start their own Postgres container; GitHub's
      # runners have Docker available.
      - name: Test
        run: uv run pytest
