[project]
name = "drivetruagent"
version = "0.1.0"
description = "Voice-first drive-through ordering agent with a backend that stays in charge of menu, stock and orders"
readme = "README.md"
authors = [
    { name = "olawaletijani", email = "tijaniolawale99@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.0",
    "openai>=3.29.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
    "testcontainers[postgres]>=4.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Evals call the real model and cost money, so they run only when asked for
# with `-m eval` (see `make eval`).
addopts = "-m 'not eval'"
markers = [
    "integration: needs Docker; runs against a real Postgres container",
    "eval: a whole conversation with the real model; needs OPENAI_API_KEY",
]

[tool.ruff]
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # import sorting
    "UP",    # modern Python syntax
    "B",     # likely bugs
    "SIM",   # simplifications
    "ASYNC", # async mistakes
    "RUF",   # ruff's own rules
]

[tool.pyright]
include = ["src", "tests", "migrations", "scripts"]
typeCheckingMode = "standard"
pythonVersion = "3.13"
