services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: drivetruagent
      POSTGRES_PASSWORD: drivetruagent
      POSTGRES_DB: drivetruagent
    ports:
      # Host port 5433, because a locally installed Postgres already uses 5432.
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drivetruagent -d drivetruagent"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The whole app, one command: `make demo`, then http://localhost:8080.
  # Not started by `make up`, which stays just Postgres for development.
  api:
    build: .
    profiles: ["app"]
    # Your keys and settings, if you have a .env; it runs without one too.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://drivetruagent:drivetruagent@db:5432/drivetruagent
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  web:
    build: ./frontend
    profiles: ["app"]
    ports:
      - "8080:80"
      # The phone webhook only; see frontend/nginx.conf and `make tunnel`.
      - "127.0.0.1:8081:8081"
    depends_on:
      api:
        condition: service_healthy

  # Tracing UI and collector: http://localhost:6006. Not started by `make up`;
  # `make phoenix` starts it. Traces are kept in its own volume.
  phoenix:
    image: arizephoenix/phoenix:version-20.17.0
    profiles: ["tracing"]
    ports:
      - "6006:6006"
    environment:
      PHOENIX_WORKING_DIR: /phoenix
    volumes:
      - phoenix_data:/phoenix

volumes:
  db_data:
  phoenix_data:
